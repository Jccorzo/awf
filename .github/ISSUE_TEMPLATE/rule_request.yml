name: Rule request
description: A command or tool awf classifies wrongly or leaves unclassified.
labels: [enhancement]
title: 'Rule: '
body:
  - type: markdown
    attributes:
      value: |
        Rules are the highest-value contribution to awf, and a good report here is most of the work.

        A script only your project has belongs in your repo's `.awf/rules.yaml`. This template is for tools other people use too. To write the rule yourself, see [Add a classifier rule](https://github.com/Jccorzo/awf/blob/main/CONTRIBUTING.md#add-a-classifier-rule).

        > [!WARNING]
        > **Keep your sessions private.** Full reports and `awf classify` show commands, file paths, the first prompt and tool output. Attach only `awf report <session> --share` copies and [scrubbed logs](https://github.com/Jccorzo/awf/blob/main/CONTRIBUTING.md#real-session-fixtures). Command lines can hold project names, hosts and tokens, so replace those with made-up values. `awf doctor --json` includes local paths, so review it before you paste it.
  - type: input
    id: tool
    attributes:
      label: Tool or command
      placeholder: frobnicate
    validations:
      required: true
  - type: textarea
    id: command-shape
    attributes:
      label: Command shape
      description: Each form you've seen, with wrappers and subcommands. Use made-up names and paths.
      placeholder: |
        frobnicate check src --strict
        npx frobnicate check src
      render: shell
    validations:
      required: true
  - type: dropdown
    id: expected-phase
    attributes:
      label: Expected phase
      description: Phases are defined in [docs/phases.md](https://github.com/Jccorzo/awf/blob/main/docs/phases.md).
      options:
        - Writing code
        - Writing tests
        - Lint and format
        - Running tests
        - Build
        - Exploring
        - Running scripts
        - Planning and answering
        - Waiting on you
        - Not sure
    validations:
      required: true
  - type: textarea
    id: stats-line
    attributes:
      label: The `awf stats` line
      description: Run `awf stats` and paste the tool's row from "Unclassified Bash time by program". If awf picked the wrong phase, run `awf stats --phase <id>`, such as `--phase tests`, and paste its row instead.
      placeholder: frobnicate  8.0s      1
      render: text
    validations:
      required: true
  - type: textarea
    id: failure-output
    attributes:
      label: How the tool reports a failure
      description: Optional. A line it prints when it fails, such as `3 checks failed`. Use made-up names. awf reads this when a pipe hides the exit code.
      render: text
  - type: input
    id: awf-version
    attributes:
      label: awf version
      description: Output of `awf --version`.
    validations:
      required: true
  - type: input
    id: agent-version
    attributes:
      label: Agent and version
      placeholder: Claude Code 2.1.312
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 15.5
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Output of `node --version`.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: Nothing here shows a real session's prompts, tool output, private paths or secrets.
          required: true
