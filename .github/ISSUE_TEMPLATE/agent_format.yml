name: Agent or log format
description: An agent or log format that broke awf, or a real Codex, Gemini or OpenCode session that doesn't read properly.
labels: [bug]
title: 'Format: '
body:
  - type: markdown
    attributes:
      value: |
        The Codex CLI, Gemini CLI and OpenCode importers have only been tested on hand-made logs, so a report from a real session helps a lot, even a small one.

        > [!WARNING]
        > **Keep your sessions private.** Full reports and `awf classify` show commands, file paths, the first prompt and tool output. Attach only `awf report <session> --share` copies and [scrubbed logs](https://github.com/Jccorzo/awf/blob/main/CONTRIBUTING.md#real-session-fixtures). `awf doctor --json` includes local paths, so review it before you paste it.
        >
        > `pnpm scrub` handles Claude Code transcripts only. For a Codex, Gemini or OpenCode log, share its structure with [the `jq` command in CONTRIBUTING.md](https://github.com/Jccorzo/awf/blob/main/CONTRIBUTING.md#other-agents-logs). Never attach the log itself.
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Claude Code
        - Codex CLI
        - Gemini CLI
        - OpenCode
        - Another agent
    validations:
      required: true
  - type: input
    id: agent-version
    attributes:
      label: Agent version
      placeholder: Codex CLI 0.50
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: For example, `awf import` didn't find the session, timings look wrong, or every step is Unclassified.
    validations:
      required: true
  - type: textarea
    id: import-output
    attributes:
      label: Output of `awf import --agent <name> --dry-run`
      description: "`<name>` is `claude-code`, `codex`, `gemini` or `opencode`. It lists sessions, steps and entries awf doesn't recognise, and writes nothing."
      render: text
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `awf doctor`
      description: Lists unknown entries for imported sessions. If you paste `awf doctor --json` instead, review it first. It includes local paths.
      render: text
  - type: textarea
    id: attachments
    attributes:
      label: Attachments
      description: A `--share` report, a scrubbed log, or a log's structure from the `jq` command. If GitHub refuses the file type, zip it first.
  - type: input
    id: awf-version
    attributes:
      label: awf version
      description: Output of `awf --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 15.5
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Output of `node --version`.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: Nothing here shows a real session's prompts, tool output, private paths or secrets.
          required: true
