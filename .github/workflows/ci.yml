name: CI

on:
  push:
    branches: [main]
  pull_request:

# id-token: write lets hushrun record and reuse results with GitHub's ID token, no secret needed.
permissions:
  contents: read
  id-token: write

jobs:
  # Lint doesn't depend on the OS or Node version, so it runs once, outside the matrix.
  # With no variants, a pass on a laptop or in an agent's sandbox skips it here too.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # With no version input, this reads packageManager from package.json.
      - uses: pnpm/action-setup@v6

      # Comes after pnpm: the cache needs pnpm to find its store.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

  check:
    name: ${{ matrix.os }}, Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Browser tests skip without Chromium, so one job installs it.
      - name: Install Chromium
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: pnpm exec playwright-core install --with-deps chromium

      # Each variant gets its own check name, so it skips only on its own pass: hushrun doesn't
      # compare the OS or Node version. Same command as package.json's test script.
      - run: pnpm exec hushrun run test-${{ matrix.os }}-node${{ matrix.node }} -- vitest run

      - run: pnpm build

      - name: Check the plugin's bundle is committed
        run: git diff --exit-code plugin/scripts
