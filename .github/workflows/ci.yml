name: CI

on:
  push:
    branches: [main]
  pull_request:

# id-token: write lets hushrun record and reuse results with GitHub's ID token, no secret needed.
permissions:
  contents: read
  id-token: write

jobs:
  # Lint doesn't depend on the OS or Node version, so it runs once, outside the matrix.
  # With no variants, a pass on a laptop or in an agent's sandbox skips it here too.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # With no version input, this reads packageManager from package.json.
      - uses: pnpm/action-setup@v6

      # Comes after pnpm: the cache needs pnpm to find its store.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

  # Tests run once, on macOS with the Node in .node-version, outside any matrix: a job without
  # variants skips on a pass from a Mac. hushrun.yaml lets only macOS on Node 22 leave a test pass.
  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # hushrun skips the test step itself, but not the setup before it. So hushrun is asked first,
      # with its own binary, before anything is installed: when a Mac already passed the tests on
      # these files, every step below is skipped. Any other answer, or none, runs them. Keep the
      # version in step with hushrun in package.json.
      - uses: hushrun/hushrun/action/setup@v0.7.0
        with:
          version: 0.7.0

      - name: Ask hushrun whether the tests already passed
        id: ready
        run: |
          state=$(hushrun ready --format json | jq -r 'first(.checks[] | select(.check == "test") | .state) // "unknown"') || state=unknown
          echo "test=${state:-unknown}" >> "$GITHUB_OUTPUT"
          echo "hushrun ready: test is ${state:-unknown}"

      - if: steps.ready.outputs.test != 'passed'
        uses: pnpm/action-setup@v6

      - if: steps.ready.outputs.test != 'passed'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - if: steps.ready.outputs.test != 'passed'
        run: pnpm install --frozen-lockfile

      # Browser tests skip without Chromium. A Mac that passes the tests has it, so CI does too.
      - if: steps.ready.outputs.test != 'passed'
        run: pnpm exec playwright-core install chromium

      - if: steps.ready.outputs.test != 'passed'
        run: pnpm test

  # Every OS and Node version still installs and builds. The tests run in the job above.
  build:
    name: Build, ${{ matrix.os }}, Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Check the plugin's bundle is committed
        run: git diff --exit-code plugin/scripts
