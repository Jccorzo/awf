name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}, Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7

      # With no version input, this reads packageManager from package.json.
      - uses: pnpm/action-setup@v6

      # Comes after pnpm: the cache needs pnpm to find its store.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Browser tests skip without Chromium, so one job installs it.
      - name: Install Chromium
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: pnpm exec playwright-core install --with-deps chromium

      - run: pnpm test

      - run: pnpm build

      - name: Check the plugin's bundle is committed
        run: git diff --exit-code plugin/scripts
